<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class="container">
        <div class="nav">
            <h1>Library</h1>
            <!-- <button id="book-btn">Add book</button> -->
            <button data-open-modal>Add Book?</button>
            <dialog data-modal>
                <form id="theForm">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>

                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author" required>

                    <label for="pages">Pages:</label>
                    <input type="number" id="pages" name="pages" required>

                    <fieldset>
                        <legend>Have you read the book yet?</legend>
                        <label><input type="radio" name="read" value="true">Yes</label>
                        <label><input type="radio" name="read" value="false">No</label>
                    </fieldset>
                    <button id="book-btn">Add book</button> <!--Temp-->
                </form>
            </dialog>
        </div>
        <div class="books">
            <!-- <div class="book"> -->
                <!-- Books add via javascript, commented out for html clarity -->
            <!-- </div> -->
        </div>
    </div>
</body>
</html>
